<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý khách hàng</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#1a73e8">
</head>
<body>
  <header>
    <h1>Quản lý khách hàng</h1>
    <nav>
      <button class="tab-btn active" data-tab="add">Thêm thông tin</button>
      <button class="tab-btn" data-tab="search">Tra cứu</button>
    </nav>
  </header>

  <main>
    <!-- TAB THÊM -->
    <section id="tab-add" class="tab-content active">
      <div id="form-message" class="message hidden"></div>
      <form id="customer-form">
        <div class="form-grid">
          <div class="field"><label>Tên khách hàng *</label><input type="text" id="customerName" required></div>
          <div class="field"><label>Địa chỉ</label><input type="text" id="address"></div>
          <div class="field"><label>Điện thoại *</label><input type="tel" id="phone" required placeholder="Ví dụ: 0901234567"></div>
          <div class="field"><label>Tên sản phẩm *</label><input type="text" id="productName" required placeholder="Nhập tên sản phẩm..."></div>
          <div class="field"><label>Mã sản phẩm *</label><input type="text" id="productCode" required></div>
          <div class="field"><label>Ngày kích hoạt *</label><input type="date" id="activationDate" required></div>
          <div class="field"><label>Tài khoản</label><input type="text" id="account"></div>
          <div class="field"><label>Mật khẩu</label><input type="text" id="password"></div>
          <div class="field"><label>Mật khẩu bảo mật</label><input type="text" id="securityPassword"></div>
          <div class="field"><label>Đơn giá (VNĐ)</label><input type="number" id="price" min="0" step="1000" placeholder="Ví dụ: 500000"></div>
          <div class="field"><label>Thẻ nhớ</label><input type="text" id="memoryCard" placeholder="Nhập tên thẻ nhớ..."></div>
          <div class="field"><label>Phụ kiện</label><input type="text" id="accessories"></div>
          <div class="field full-width"><label>Ghi chú</label><textarea id="note" rows="2"></textarea></div>
        </div>
        <div class="form-actions">
          <button type="submit" id="btn-save" class="btn-primary">Lưu thông tin</button>
          <button type="button" id="btn-reset" class="btn-secondary">Làm mới</button>
        </div>
      </form>
    </section>

    <!-- TAB TRA CỨU -->
    <section id="tab-search" class="tab-content">
      <div class="search-controls">
        <div class="search-type">
          <label><input type="radio" name="searchType" value="phone" checked> Theo số điện thoại</label>
          <label><input type="radio" name="searchType" value="name"> Theo tên khách hàng</label>
        </div>
        <div class="search-input-row">
          <input type="text" id="search-keyword" placeholder="Nhập SĐT hoặc tên...">
          <button id="btn-search" class="btn-primary">Tìm kiếm</button>
        </div>
      </div>
      <div id="search-results"></div>
      <div id="detail-panel" class="detail-panel hidden"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
